name: Update language card

on:
  # Runs on push so the first commit generates the cards. Without this the
  # workflow sits idle until the schedule fires and the README points at an
  # assets/ directory that does not exist yet.
  push:
    branches: [main]
  schedule:
    - cron: '0 4 * * 1' # Mondays, 04:00 UTC
  workflow_dispatch: # and on demand

permissions:
  contents: write

jobs:
  card:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Render the language card
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
          # Count only repositories created from 2023 onward. Before that the
          # profile is embedded coursework, which outweighs the recent AI work
          # by volume and describes a career stage that has moved on. The card
          # says "since 2023" so the filter is visible. See SETUP.md.
          SINCE_YEAR: '2023'
        run: node scripts/generate-cards.mjs

      - name: Commit if the card changed
        run: |
          if [[ -z "$(git status --porcelain assets)" ]]; then
            echo 'card unchanged, nothing to commit'
            exit 0
          fi
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add assets
          git commit -m 'chore: refresh language card [skip ci]'
          if ! git push; then
            echo '::error::Push failed. Enable Settings > Actions > General > Workflow permissions > Read and write.'
            exit 1
          fi
