name: Update language card

on:
  schedule:
    - cron: '0 4 * * 1' # Mondays, 04:00 UTC
  workflow_dispatch: # and on demand

permissions:
  contents: write

jobs:
  card:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Render the language card
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
          # Vendored code inside this fork would otherwise report 57% C++ and
          # bury the Python. See SETUP.md.
          EXCLUDE_REPOS: dynamic_agent_perception
        run: node scripts/generate-cards.mjs

      - name: Commit if the card changed
        run: |
          if [[ -n "$(git status --porcelain assets)" ]]; then
            git config user.name  'github-actions[bot]'
            git config user.email 'github-actions[bot]@users.noreply.github.com'
            git add assets
            git commit -m 'chore: refresh language card'
            git push
          else
            echo 'no change'
          fi
